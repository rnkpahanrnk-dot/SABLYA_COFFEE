  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Бронирование столика — SABLYA COFFEE</title>
  <meta name="description" content="Забронируйте столик в SABLYA COFFEE в Бабаюрте. Гости, дата и время — подтверждение придёт в WhatsApp.">
  <meta name="theme-color" content="#2b2019">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Бронирование столика — SABLYA COFFEE">
  <meta property="og:description" content="Забронируйте столик — подтверждение придёт в WhatsApp.">
  <meta property="og:locale" content="ru_RU">

<body data-page="booking">

  <main id="main">

    <!-- ======================= ЗАГОЛОВОК СТРАНИЦЫ ======================= -->
    <section class="page-hero">
      <div class="hero-pattern" aria-hidden="true"></div>
      <div class="container page-hero-inner">
        <svg class="ornament" viewBox="0 0 240 20" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true">
          <path d="M0 10h66"/>
          <path d="M174 10h66"/>
          <path d="M120 3l5 7-5 7-5-7 5-7z"/>
          <circle cx="72" cy="10" r="2"/><circle cx="168" cy="10" r="2"/>
        </svg>
        <p class="kicker">Бронирование</p>
        <h1>Забронировать столик</h1>
        <p class="page-sub">Заполните форму — подтверждение брони придёт в WhatsApp. Имя и телефон не обязательны.</p>
      </div>
    </section>

    <!-- ======================= ФОРМА БРОНИ ======================= -->
    <section class="section section--warm">
      <div class="container narrow">
        <form class="booking-form reveal" id="bookingForm" novalidate>
          <div class="form-grid">
            <label class="field">
              <span class="field-label">Имя <i class="optional">необязательно</i></span>
              <input type="text" id="bkName" maxlength="40" placeholder="Как к вам обращаться">
            </label>
            <label class="field">
              <span class="field-label">Телефон <i class="optional">необязательно</i></span>
              <input type="tel" id="bkPhone" maxlength="20" placeholder="+7 (___) ___-__-__" inputmode="tel">
            </label>
          </div>

          <div class="form-grid">
            <div class="field">
              <span class="field-label">Количество гостей <i class="field-required">обязательно</i></span>
              <div class="stepper">
                <button type="button" class="stepper-btn" id="guestsMinus" aria-label="Меньше гостей">−</button>
                <span class="stepper-value" id="guestsValue">2</span>
                <button type="button" class="stepper-btn" id="guestsPlus" aria-label="Больше гостей">+</button>
              </div>
            </div>
            <div class="field">
              <span class="field-label">Время <i class="field-required">обязательно</i></span>
              <select id="bkTime" class="select" aria-label="Время брони"></select>
            </div>
          </div>

          <div class="form-grid">
            <label class="field">
              <span class="field-label">Дата <i class="field-required">обязательно</i></span>
              <input type="date" id="bkDate" class="input-date">
            </label>
            <label class="field">
              <span class="field-label">Комментарий <i class="optional">необязательно</i></span>
              <input type="text" id="bkComment" maxlength="200" placeholder="Пожелания к столику">
            </label>
          </div>

          <button type="submit" class="btn btn--primary btn--wide">Забронировать столик</button>
          <p class="form-hint">Бронь откроется в WhatsApp — останется нажать «Отправить».</p>
        </form>
      </div>
    </section>
  </main>

  <noscript>
    <p style="text-align:center;padding:24px 16px;font-family:system-ui,sans-serif;color:#33261d;">

  </noscript>
