<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SABLYA COFFEE | Этническая кофейня</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Шапка -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="SABLYA COFFEE" class="logo-img">
            </div>
            <nav class="nav">
                <a href="#home">Главная</a>
                <a href="#menu">Меню</a>
                <a href="#booking" onclick="openBooking()">Бронирование</a>
                <a href="#contacts">Контакты</a>
            </nav>
            <div class="cart-icon" onclick="toggleCart()">
                <span>🛒</span>
                <div id="cart-count">0</div>
            </div>
        </div>
    </header>

    <!-- Главный экран -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1 class="ethno-title">SABLYA COFFEE</h1>
            <p class="hero-subtitle">Вкус гор в каждой чашке</p>
            <div class="hero-btns">
                <a href="#menu" class="btn btn-primary">Посмотреть меню</a>
                <button class="btn btn-secondary" onclick="openBooking()">Забронировать стол</button>
            </div>
        </div>
    </section>

    <!-- Меню -->
    <section id="menu" class="menu-section">
        <div class="container">
            <h2 class="section-title">Наше Меню</h2>
            
            <div class="menu-categories" id="categories">
                <!-- Категории рендерятся из JS -->
            </div>

            <div class="menu-grid" id="menu-grid">
                <!-- Товары рендерятся из JS -->
            </div>
        </div>
    </section>

    <!-- Корзина (Модальное окно) -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="toggleCart()">&times;</span>
            <h3 class="ethno-header">Ваш заказ</h3>
            <div id="cart-items"></div>
            <div class="cart-total">
                Итого: <span id="cart-total-price">0</span> ₽
            </div>
            
            <div class="order-type">
                <label><input type="radio" name="delivery-type" value="В зале" checked> В зале</label>
                <label><input type="radio" name="delivery-type" value="Доставка"> Доставка</label>
                <label><input type="radio" name="delivery-type" value="С собой"> С собой</label>
            </div>

            <form id="order-form" class="order-form">
                <input type="text" id="order-name" placeholder="Ваше имя" required>
                <input type="tel" id="order-phone" placeholder="Ваш телефон" required>
                <input type="text" id="order-address" placeholder="Адрес доставки (если выбрана)" class="hidden">
                <textarea id="order-comment" placeholder="Комментарий к заказу"></textarea>
                <select id="order-payment">
                    <option value="Картой">Оплата картой</option>
                    <option value="Наличными">Оплата наличными</option>
                </select>
                <button type="submit" class="btn btn-primary full-width">Оформить через WhatsApp</button>
            </form>
        </div>
    </div>

    <!-- Бронирование (Модальное окно) -->
    <div id="booking-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeBooking()">&times;</span>
            <h3 class="ethno-header">Бронирование столика</h3>
            <form id="booking-form" class="order-form">
                <input type="text" id="book-name" placeholder="Ваше имя" required>
                <input type="date" id="book-date" required>
                <input type="time" id="book-time" required>
                <input type="number" id="book-guests" placeholder="Кол-во гостей" required>
                <textarea id="book-comment" placeholder="Ваши пожелания"></textarea>
                <button type="submit" class="btn btn-primary full-width">Забронировать через WhatsApp</button>
            </form>
        </div>
    </div>

    <!-- Футер -->
    <footer id="contacts">
        <div class="container footer-grid">
            <div class="footer-info">
                <h4 class="ethno-header">SABLYA COFFEE</h4>
                <p>📍 Адрес: Уточните адрес</p>
                <p>⏰ Время работы: 09:00 - 23:00</p>
            </div>
            <div class="footer-socials">
                <h4>Мы в соцсетях</h4>
                <div class="social-links">
                    <a href="https://www.instagram.com/sabllyaa?utm_source=qr" target="_blank">Instagram</a>
                    <a href="https://chat.whatsapp.com/LUt8cAMwP643f9Od00mOk7?s=sh&p=a&ilr=1" target="_blank">Группа WhatsApp</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
